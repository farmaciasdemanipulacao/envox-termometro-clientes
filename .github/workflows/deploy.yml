name: Deploy → Hostinger VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:   # permite disparar manualmente pelo GitHub UI

# ── Variáveis de ambiente globais ───────────────────────────────────────────
env:
  DEPLOY_PATH: /opt/envox-intel   # pasta no servidor onde o projeto fica

jobs:
  # ────────────────────────────────────────────────────────────────────────
  # JOB 1 — Testes rápidos antes de fazer deploy
  # ────────────────────────────────────────────────────────────────────────
  test:
    name: ✅ Testes Python
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependências
        run: |
          cd backend
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validar imports e lógica core
        run: |
          cd backend
          python -c "
          import sys, os
          sys.path.insert(0, '.')
          os.environ.setdefault('DATABASE_URL', 'postgresql+asyncpg://x:x@localhost/x')
          os.environ.setdefault('SECRET_KEY', 'test-key-for-ci')
          os.environ.setdefault('FIRST_ADMIN_EMAIL', 'admin@test.com')
          os.environ.setdefault('FIRST_ADMIN_PASSWORD', 'test')

          # Config
          from app.core.config import settings
          print('[1/4] Config OK')

          # Security
          from app.core.security import create_access_token, hash_password, verify_password
          token = create_access_token({'sub': 'test'})
          assert token
          hashed = hash_password('senha123')
          assert verify_password('senha123', hashed)
          print('[2/4] Security OK')

          # Heurísticas - 7 casos de teste
          from app.services.analysis.heuristics import HeuristicsEngine
          engine = HeuristicsEngine()
          tests = [
            ('Quero cancelar meu contrato!', True, False),
            ('Me manda uma proposta para expandir para 10 usuarios', False, True),
            ('Ótimo atendimento, muito obrigado!', False, False),
            ('Isso é um absurdo, não funciona nada!', False, False),
            ('URGENTE preciso de ajuda agora!!!', False, False),
            ('Tenho interesse em contratar mais serviços', False, True),
            ('Situação normal, funcionando bem', False, False),
          ]
          passed = 0
          for msg, expect_churn, expect_opp in tests:
            r = engine.analyze(msg)
            if r.is_churn_risk == expect_churn and r.is_opportunity == expect_opp:
              passed += 1
            else:
              print(f'  FALHOU: \"{msg}\" churn={r.is_churn_risk}(exp={expect_churn}) opp={r.is_opportunity}(exp={expect_opp})')
          assert passed == 7, f'Heurísticas: {passed}/7'
          print(f'[3/4] Heurísticas OK ({passed}/7)')

          # Schemas
          from app.schemas.ingest import IngestMessageRequest
          from app.schemas.dashboard import DashboardOverview
          print('[4/4] Schemas OK')
          print('>>> CI validação: TUDO OK <<<')
          "

  # ────────────────────────────────────────────────────────────────────────
  # JOB 2 — Deploy no VPS via SSH (só roda se os testes passarem)
  # ────────────────────────────────────────────────────────────────────────
  deploy:
    name: 🚀 Deploy VPS Hostinger
    runs-on: ubuntu-latest
    needs: test          # bloqueia se testes falharem
    environment: production

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Adicionar VPS ao known_hosts
        run: |
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy via SSH
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'ENDSSH'
            set -e
            echo "=============================="
            echo "  ENVOX Intel — Deploy $(date)"
            echo "=============================="

            # 1. Atualizar código
            cd ${{ env.DEPLOY_PATH }}
            git pull origin main
            echo "✅ Código atualizado"

            # 2. Reconstruir apenas o backend (sem derrubar o banco)
            docker compose build --no-cache backend
            echo "✅ Imagem backend reconstruída"

            # 3. Reiniciar serviços (banco continua rodando)
            docker compose up -d --no-deps backend frontend
            echo "✅ Serviços reiniciados"

            # 4. Aguardar backend estar saudável
            echo "⏳ Aguardando backend..."
            sleep 10
            for i in $(seq 1 12); do
              STATUS=$(docker compose ps backend --format json 2>/dev/null | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('Health','unknown'))" 2>/dev/null || echo "unknown")
              if [ "$STATUS" = "healthy" ]; then
                echo "✅ Backend saudável!"
                break
              fi
              echo "  Tentativa $i/12 — aguardando..."
              sleep 5
            done

            # 5. Health check final via curl
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/health)
            if [ "$HTTP_CODE" = "200" ]; then
              echo "✅ Health check OK (HTTP 200)"
            else
              echo "❌ Health check falhou (HTTP $HTTP_CODE)"
              docker compose logs --tail=50 backend
              exit 1
            fi

            echo ""
            echo "=============================="
            echo "  Deploy concluído com sucesso!"
            echo "=============================="
          ENDSSH

      - name: Notificar resultado
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "🎉 Deploy realizado com sucesso no VPS!"
          else
            echo "❌ Deploy FALHOU — verificar logs acima"
          fi
