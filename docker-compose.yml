version: "3.9"

services:

  # ============================================================
  # PostgreSQL 15 — Banco de dados principal
  # INTERNO — sem porta exposta ao host
  # ============================================================
  postgres:
    image: postgres:15-alpine
    container_name: envox-intel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-envox}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-envox123}
      POSTGRES_DB: ${POSTGRES_DB:-envox_intel}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-envox} -d ${POSTGRES_DB:-envox_intel}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - envox-internal

  # ============================================================
  # Backend — FastAPI
  # Traefik usa network_mode:host — labels são suficientes
  # ============================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: envox-intel-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-envox}:${POSTGRES_PASSWORD:-envox123}@postgres:5432/${POSTGRES_DB:-envox_intel}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app:ro
    networks:
      - envox-internal
    labels:
      - "traefik.enable=true"
      # Rota /api/
      - "traefik.http.routers.envox-api.rule=Host(`${DOMAIN:-intel.envox.com.br}`) && PathPrefix(`/api`)"
      - "traefik.http.routers.envox-api.entrypoints=websecure"
      - "traefik.http.routers.envox-api.tls.certresolver=letsencrypt"
      - "traefik.http.routers.envox-api.service=envox-api-svc"
      - "traefik.http.services.envox-api-svc.loadbalancer.server.port=8000"
      # Rota /docs
      - "traefik.http.routers.envox-docs.rule=Host(`${DOMAIN:-intel.envox.com.br}`) && PathPrefix(`/docs`)"
      - "traefik.http.routers.envox-docs.entrypoints=websecure"
      - "traefik.http.routers.envox-docs.tls.certresolver=letsencrypt"
      - "traefik.http.routers.envox-docs.service=envox-api-svc"
      # Rota /openapi.json
      - "traefik.http.routers.envox-openapi.rule=Host(`${DOMAIN:-intel.envox.com.br}`) && PathPrefix(`/openapi.json`)"
      - "traefik.http.routers.envox-openapi.entrypoints=websecure"
      - "traefik.http.routers.envox-openapi.tls.certresolver=letsencrypt"
      - "traefik.http.routers.envox-openapi.service=envox-api-svc"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ============================================================
  # Frontend — Nginx com dashboard estático
  # Traefik roteia o domínio raiz para cá
  # ============================================================
  frontend:
    image: nginx:alpine
    container_name: envox-intel-frontend
    restart: unless-stopped
    volumes:
      - ./frontend/public:/usr/share/nginx/html:ro
      - ./infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - envox-internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.envox-frontend.rule=Host(`${DOMAIN:-intel.envox.com.br}`)"
      - "traefik.http.routers.envox-frontend.entrypoints=websecure"
      - "traefik.http.routers.envox-frontend.tls.certresolver=letsencrypt"
      - "traefik.http.routers.envox-frontend.service=envox-frontend-svc"
      - "traefik.http.services.envox-frontend-svc.loadbalancer.server.port=80"
      - "traefik.http.routers.envox-frontend.priority=1"

volumes:
  postgres_data:
    name: envox-intel-postgres-data

networks:
  # Rede interna isolada entre os containers deste projeto
  envox-internal:
    name: envox-intel-internal
    driver: bridge
