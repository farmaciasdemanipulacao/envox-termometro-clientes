version: "3.9"

services:

  # ============================================================
  # PostgreSQL 15 — Banco de dados principal
  # ============================================================
  postgres:
    image: postgres:15-alpine
    container_name: envox-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-envox}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-envox123}
      POSTGRES_DB: ${POSTGRES_DB:-envox_intel}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-envox} -d ${POSTGRES_DB:-envox_intel}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - envox-network

  # ============================================================
  # Backend — FastAPI
  # ============================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: envox-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-envox}:${POSTGRES_PASSWORD:-envox123}@postgres:5432/${POSTGRES_DB:-envox_intel}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # Em desenvolvimento, monta o código para hot reload
      - ./backend:/app:ro
    networks:
      - envox-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ============================================================
  # Frontend — Nginx servindo o dashboard estático
  # ============================================================
  frontend:
    image: nginx:alpine
    container_name: envox-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    volumes:
      - ./frontend/public:/usr/share/nginx/html:ro
      - ./infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - envox-network

volumes:
  postgres_data:
    name: envox-postgres-data

networks:
  envox-network:
    name: envox-network
    driver: bridge
