<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />

  <!-- ─── Tema claro/escuro: aplica ANTES do primeiro paint p/ evitar flash ─── -->
  <script>
    (function() {
      try {
        var stored = localStorage.getItem('atenx-theme');
        var theme = stored || (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>

  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#111b21" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>ATENX</title>
  <meta name="description" content="ATENX by Envox — Monitoramento e análise de grupos WhatsApp em tempo real" />

  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="/favicon.ico?v=2" />

  <!-- PWA manifest + icons -->
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png?v=2" />
  <meta name="apple-mobile-web-app-title" content="ATENX" />

  <!-- ─── Design System CSS ─── -->
  <link rel="stylesheet" href="_ds/envox-intelligence-design-system-daebe7cb-3fd0-46d3-98b6-73c2b00ae305/tokens/colors.css" />
  <link rel="stylesheet" href="_ds/envox-intelligence-design-system-daebe7cb-3fd0-46d3-98b6-73c2b00ae305/tokens/theme.css" />
  <link rel="stylesheet" href="_ds/envox-intelligence-design-system-daebe7cb-3fd0-46d3-98b6-73c2b00ae305/tokens/typography.css" />
  <link rel="stylesheet" href="_ds/envox-intelligence-design-system-daebe7cb-3fd0-46d3-98b6-73c2b00ae305/tokens/spacing.css" />
  <link rel="stylesheet" href="_ds/envox-intelligence-design-system-daebe7cb-3fd0-46d3-98b6-73c2b00ae305/styles.css" />

  <!-- ─── Font Awesome ─── -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.1/css/all.min.css"
    crossorigin="anonymous"
  />

  <!-- ─── Base styles ─── -->
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--color-bg-page);
      color: var(--color-text-primary);
      font-family: var(--font-sans, 'Inter', system-ui, sans-serif);
      -webkit-font-smoothing: antialiased;
    }

    #root {
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    /* Loading screen shown before React mounts */
    #boot-loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      background: var(--color-bg-page);
      z-index: 9999;
      transition: opacity 0.4s ease;
    }
    #boot-loading.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .boot-logo {
      width: 220px;
      max-width: 60vw;
      display: none;
      animation: logoPulse 2.4s ease-in-out infinite;
    }
    :root[data-theme="light"] .boot-logo-light { display: block; }
    :root[data-theme="dark"]  .boot-logo-dark  { display: block; }
    .boot-dots { display: flex; gap: 8px; }
    .boot-dots span {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #0d9488;
      animation: dotBlink 1.3s ease-in-out infinite;
    }
    .boot-dots span:nth-child(2) { animation-delay: 0.2s; }
    .boot-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Tela de loading pós-login: logo horizontal pulsando + pontinhos */
    @keyframes logoPulse {
      0%, 100% { opacity: 1;    transform: scale(1); }
      50%      { opacity: 0.55; transform: scale(0.94); }
    }
    @keyframes dotBlink {
      0%, 80%, 100% { opacity: 0.25; transform: scale(0.75); }
      40%           { opacity: 1;    transform: scale(1); }
    }

    /* Toast notifications */
    #toast-container {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 10000;
      display: flex;
      flex-direction: column;
      gap: 10px;
      pointer-events: none;
    }
    .toast {
      padding: 12px 18px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 500;
      color: #fff;
      min-width: 240px;
      max-width: 380px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
      animation: toastIn 0.3s ease;
      pointer-events: auto;
      display: flex;
      align-items: center;
      gap: 10px;
      line-height: 1.4;
    }
    .toast.success { background: #16a34a; }
    .toast.error   { background: #dc2626; }
    .toast.warning { background: #d97706; }
    .toast.info    { background: #0d9488; }
    .toast i       { flex-shrink: 0; font-size: 16px; }
    @keyframes toastIn {
      from { opacity: 0; transform: translateX(30px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    /* Mobile: prevent iOS zoom on inputs */
    @media (max-width: 767px) {
      input, select, textarea { font-size: 16px !important; }
      html, body { overflow-x: hidden; }
    }

    /* Safe area for notch/bottom bar on iOS */
    @supports (padding: env(safe-area-inset-bottom)) {
      .bottom-nav-safe { padding-bottom: env(safe-area-inset-bottom); }
    }

    /* Slide-in animation for mobile drawer */
    @keyframes slideInLeft {
      from { transform: translateX(-100%); }
      to   { transform: translateX(0); }
    }

    /* Scrollbar styling */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--color-scrollbar-thumb); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--color-text-placeholder); }

    /* Utility: visually hidden */
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0,0,0,0);
      white-space: nowrap;
      border: 0;
    }
  </style>
</head>

<body>

  <!-- Boot loading screen (removed when React mounts) -->
  <div id="boot-loading">
    <img class="boot-logo boot-logo-light" src="/atenx_assets/png/atenx-logo-transparent-600.png" alt="ATENX" />
    <img class="boot-logo boot-logo-dark"  src="/atenx_assets/png/atenx-logo-white-transparent-600.png" alt="ATENX" />
    <div class="boot-dots"><span></span><span></span><span></span></div>
  </div>

  <!-- Toast notification container -->
  <div id="toast-container"></div>

  <!-- React mount point -->
  <div id="root"></div>

  <!-- ─── Design System Bundle (must be first) ─── -->
  <script src="_ds/envox-intelligence-design-system-daebe7cb-3fd0-46d3-98b6-73c2b00ae305/_ds_bundle.js"></script>

  <!-- ─── React 18 + ReactDOM + Babel Standalone ─── -->
  <script crossorigin src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.24.7/babel.min.js"></script>

  <!-- ─── Fallback / mock data ─── -->
  <script src="tc-data.js"></script>

  <!-- ─── Shared utilities, API helpers, Sidebar, components ─── -->
  <script type="text/babel" data-presets="react" src="tc-shared.jsx"></script>

  <!-- ─── Screens A: Login, Dashboard, Alerts ─── -->
  <script type="text/babel" data-presets="react" src="tc-screens-a.jsx"></script>

  <!-- ─── Screens B: Groups, Summary, Team, ApiDocs, Config ─── -->
  <script type="text/babel" data-presets="react" src="tc-screens-b.jsx"></script>

  <!-- ─── WhatsApp QR connection screen ─── -->
  <script type="text/babel" data-presets="react" src="tc-wpp.jsx"></script>

  <!-- ─── Public pages: Landing, Pricing, Registration ─── -->
  <script type="text/babel" data-presets="react" src="tc-public.jsx"></script>

  <!-- ─── Admin panel ─── -->
  <script type="text/babel" data-presets="react" src="tc-admin.jsx"></script>

  <!-- ─── Onboarding wizard ─── -->
  <script type="text/babel" data-presets="react" src="tc-onboarding.jsx"></script>

  <!-- ─── Main App Router (mounts React) ─── -->
  <script type="text/babel" data-presets="react" src="tc-app.jsx"></script>

  <!-- ─── Service Worker + Push ─── -->
  <script>
    // Captura o evento de instalação PWA antes do React montar
    window._installPrompt = null;
    window.addEventListener('beforeinstallprompt', function(e) {
      e.preventDefault();
      window._installPrompt = e;
      // Notifica o React caso já esteja montado
      if (window._onInstallPromptReady) window._onInstallPromptReady();
    });

    // Registra o Service Worker (necessário para PWA install e push)
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').then(function(reg) {
        console.log('[SW] Registrado:', reg.scope);
      }).catch(function(err) {
        console.warn('[SW] Falha no registro:', err);
      });
    }

    // Escuta mensagens do SW para navegar a uma página
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.addEventListener('message', function(event) {
        if (event.data && event.data.type === 'NAVIGATE') {
          // tc-app.jsx define window.envoxNavigate ao montar
          if (window.envoxNavigate) window.envoxNavigate(event.data.url);
        }
      });
    }

    // Helpers de push expostos globalmente para o React usar
    window.pushHelpers = {
      isSupported: function() {
        return 'PushManager' in window && 'serviceWorker' in navigator;
      },

      getPermission: function() {
        return Notification.permission; // 'default' | 'granted' | 'denied'
      },

      // Converte base64url para Uint8Array (necessário para applicationServerKey)
      _urlBase64ToUint8Array: function(base64String) {
        var padding = '='.repeat((4 - base64String.length % 4) % 4);
        var base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
        var raw = window.atob(base64);
        var arr = new Uint8Array(raw.length);
        for (var i = 0; i < raw.length; i++) arr[i] = raw.charCodeAt(i);
        return arr;
      },

      // Pede permissão e cria subscription; retorna {endpoint, p256dh, auth} ou null
      subscribe: async function() {
        if (!this.isSupported()) return null;

        var permission = await Notification.requestPermission();
        if (permission !== 'granted') return null;

        var reg = await navigator.serviceWorker.ready;

        // Busca chave pública VAPID do backend
        var resp = await fetch('/api/v1/push/vapid-public-key', {
          headers: { Authorization: 'Bearer ' + (localStorage.getItem('envox_token') || '') }
        });
        if (!resp.ok) return null;
        var { public_key } = await resp.json();

        var sub = await reg.pushManager.subscribe({
          userVisibleOnly: true,
          applicationServerKey: this._urlBase64ToUint8Array(public_key),
        });

        var json = sub.toJSON();
        var body = {
          endpoint: json.endpoint,
          p256dh: json.keys.p256dh,
          auth: json.keys.auth,
          user_agent: navigator.userAgent,
        };

        // Registra no backend
        var saveResp = await fetch('/api/v1/push/subscribe', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            Authorization: 'Bearer ' + (localStorage.getItem('envox_token') || ''),
          },
          body: JSON.stringify(body),
        });

        return saveResp.ok ? body : null;
      },

      unsubscribe: async function() {
        var reg = await navigator.serviceWorker.ready;
        var sub = await reg.pushManager.getSubscription();
        if (!sub) return;
        var endpoint = sub.endpoint;
        await sub.unsubscribe();
        await fetch('/api/v1/push/unsubscribe', {
          method: 'DELETE',
          headers: {
            'Content-Type': 'application/json',
            Authorization: 'Bearer ' + (localStorage.getItem('envox_token') || ''),
          },
          body: JSON.stringify({ endpoint }),
        });
      },
    };
  </script>

  <!-- ─── Remove boot screen after React mounts ─── -->
  <script>
    // Babel compiles async; wait for React to render then fade out loader
    (function waitForRoot() {
      var attempts = 0;
      var iv = setInterval(function() {
        attempts++;
        var root = document.getElementById('root');
        var loader = document.getElementById('boot-loading');
        if ((root && root.children.length > 0) || attempts > 80) {
          clearInterval(iv);
          if (loader) {
            loader.classList.add('hidden');
            setTimeout(function() { loader.remove(); }, 500);
          }
        }
      }, 150);
    })();
  </script>

</body>
</html>
