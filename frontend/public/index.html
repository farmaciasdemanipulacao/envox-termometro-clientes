<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#111b21" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>ENVOX Intelligence</title>
  <meta name="description" content="ENVOX Intelligence — Monitoramento e análise de grupos WhatsApp em tempo real" />

  <!-- Favicon inline -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%230d9488'/><text x='16' y='22' font-size='18' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'>E</text></svg>" />

  <!-- ─── Design System CSS ─── -->
  <link rel="stylesheet" href="_ds/envox-intelligence-design-system-daebe7cb-3fd0-46d3-98b6-73c2b00ae305/tokens/colors.css" />
  <link rel="stylesheet" href="_ds/envox-intelligence-design-system-daebe7cb-3fd0-46d3-98b6-73c2b00ae305/tokens/typography.css" />
  <link rel="stylesheet" href="_ds/envox-intelligence-design-system-daebe7cb-3fd0-46d3-98b6-73c2b00ae305/tokens/spacing.css" />
  <link rel="stylesheet" href="_ds/envox-intelligence-design-system-daebe7cb-3fd0-46d3-98b6-73c2b00ae305/styles.css" />

  <!-- ─── Font Awesome ─── -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.1/css/all.min.css"
    crossorigin="anonymous"
  />

  <!-- ─── Base styles ─── -->
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--color-bg-page, #0f172a);
      color: var(--color-text-primary, #f1f5f9);
      font-family: var(--font-sans, 'Inter', system-ui, sans-serif);
      -webkit-font-smoothing: antialiased;
    }

    #root {
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    /* Loading screen shown before React mounts */
    #boot-loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      background: var(--color-bg-page, #0f172a);
      z-index: 9999;
      transition: opacity 0.4s ease;
    }
    #boot-loading.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .boot-logo {
      width: 64px;
      height: 64px;
      border-radius: 14px;
      background: linear-gradient(135deg, #0d9488, #075e54);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      font-weight: 800;
      color: #fff;
      letter-spacing: -1px;
      box-shadow: 0 0 40px rgba(13,148,136,0.5);
    }
    .boot-title {
      font-size: 22px;
      font-weight: 700;
      color: #f1f5f9;
      letter-spacing: -0.5px;
    }
    .boot-subtitle {
      font-size: 13px;
      color: #64748b;
      margin-top: -12px;
    }
    .boot-spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(13,148,136,0.2);
      border-top-color: #0d9488;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Toast notifications */
    #toast-container {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 10000;
      display: flex;
      flex-direction: column;
      gap: 10px;
      pointer-events: none;
    }
    .toast {
      padding: 12px 18px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 500;
      color: #fff;
      min-width: 240px;
      max-width: 380px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
      animation: toastIn 0.3s ease;
      pointer-events: auto;
      display: flex;
      align-items: center;
      gap: 10px;
      line-height: 1.4;
    }
    .toast.success { background: #16a34a; }
    .toast.error   { background: #dc2626; }
    .toast.warning { background: #d97706; }
    .toast.info    { background: #0d9488; }
    .toast i       { flex-shrink: 0; font-size: 16px; }
    @keyframes toastIn {
      from { opacity: 0; transform: translateX(30px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    /* Mobile: prevent iOS zoom on inputs */
    @media (max-width: 767px) {
      input, select, textarea { font-size: 16px !important; }
      html, body { overflow-x: hidden; }
    }

    /* Safe area for notch/bottom bar on iOS */
    @supports (padding: env(safe-area-inset-bottom)) {
      .bottom-nav-safe { padding-bottom: env(safe-area-inset-bottom); }
    }

    /* Slide-in animation for mobile drawer */
    @keyframes slideInLeft {
      from { transform: translateX(-100%); }
      to   { transform: translateX(0); }
    }

    /* Scrollbar styling */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(148,163,184,0.2); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(148,163,184,0.4); }

    /* Utility: visually hidden */
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0,0,0,0);
      white-space: nowrap;
      border: 0;
    }
  </style>
</head>

<body>

  <!-- Boot loading screen (removed when React mounts) -->
  <div id="boot-loading">
    <div class="boot-logo">E</div>
    <div>
      <p class="boot-title">ENVOX Intelligence</p>
      <p class="boot-subtitle">Carregando sistema…</p>
    </div>
    <div class="boot-spinner"></div>
  </div>

  <!-- Toast notification container -->
  <div id="toast-container"></div>

  <!-- React mount point -->
  <div id="root"></div>

  <!-- ─── Design System Bundle (must be first) ─── -->
  <script src="_ds/envox-intelligence-design-system-daebe7cb-3fd0-46d3-98b6-73c2b00ae305/_ds_bundle.js"></script>

  <!-- ─── React 18 + ReactDOM + Babel Standalone ─── -->
  <script crossorigin src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.24.7/babel.min.js"></script>

  <!-- ─── Fallback / mock data ─── -->
  <script src="tc-data.js"></script>

  <!-- ─── Shared utilities, API helpers, Sidebar, components ─── -->
  <script type="text/babel" data-presets="react" src="tc-shared.jsx"></script>

  <!-- ─── Screens A: Login, Dashboard, Alerts ─── -->
  <script type="text/babel" data-presets="react" src="tc-screens-a.jsx"></script>

  <!-- ─── Screens B: Groups, Summary, Team, ApiDocs, Config ─── -->
  <script type="text/babel" data-presets="react" src="tc-screens-b.jsx"></script>

  <!-- ─── WhatsApp QR connection screen ─── -->
  <script type="text/babel" data-presets="react" src="tc-wpp.jsx"></script>

  <!-- ─── Main App Router (mounts React) ─── -->
  <script type="text/babel" data-presets="react" src="tc-app.jsx"></script>

  <!-- ─── Remove boot screen after React mounts ─── -->
  <script>
    // Babel compiles async; wait for React to render then fade out loader
    (function waitForRoot() {
      var attempts = 0;
      var iv = setInterval(function() {
        attempts++;
        var root = document.getElementById('root');
        var loader = document.getElementById('boot-loading');
        if ((root && root.children.length > 0) || attempts > 80) {
          clearInterval(iv);
          if (loader) {
            loader.classList.add('hidden');
            setTimeout(function() { loader.remove(); }, 500);
          }
        }
      }, 150);
    })();
  </script>

</body>
</html>
