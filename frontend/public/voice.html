<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="robots" content="noindex,nofollow,noarchive" />
  <title>Pesquisa de Percepção | Envox</title>
  <style>
    :root{--brand:#0d9488;--brand2:#0f766e;--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--soft:#f8fafc;--danger:#b91c1c;--ok:#047857;--shadow:0 18px 55px rgba(15,23,42,.08)}
    *{box-sizing:border-box} html{scroll-behavior:smooth} body{margin:0;background:#f1f5f9;color:var(--ink);font:15px/1.55 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    button,input,textarea{font:inherit} button{cursor:pointer} .shell{max-width:860px;margin:0 auto;padding:28px 18px 80px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px}.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.02em}.mark{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,var(--brand),#14b8a6);box-shadow:0 8px 24px rgba(13,148,136,.22)}.secure{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}.hero,.card,.done,.errorbox{background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}.hero{padding:30px;margin-bottom:18px}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--brand2);font-weight:800}.hero h1{font-size:30px;line-height:1.15;margin:8px 0 12px;letter-spacing:-.035em}.hero p{color:#475569;margin:8px 0}.who{margin-top:18px;padding:14px 16px;border-radius:14px;background:#f0fdfa;border:1px solid #ccfbf1}.who strong{display:block}.meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:5px;color:#52716d;font-size:13px}.conf{margin-top:16px;padding:14px 16px;border-left:3px solid var(--brand);background:var(--soft);border-radius:0 12px 12px 0;color:#475569;font-size:13px}.progress-wrap{position:sticky;top:0;z-index:20;background:rgba(241,245,249,.94);backdrop-filter:blur(8px);padding:10px 0 14px}.progress-line{height:7px;background:#dbe4ea;border-radius:999px;overflow:hidden}.progress-line>span{display:block;height:100%;background:linear-gradient(90deg,var(--brand),#14b8a6);width:0;transition:width .25s ease}.progress-text{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:6px}.section-title{margin:26px 2px 10px;font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:#64748b;font-weight:800}.card{padding:24px;margin:12px 0}.qnum{font-size:12px;color:var(--brand2);font-weight:800}.prompt{font-size:18px;line-height:1.4;font-weight:700;letter-spacing:-.01em;margin:5px 0 6px}.help{font-size:13px;color:var(--muted);margin-bottom:14px}.required{color:var(--danger)}.choices{display:grid;gap:9px}.choice{display:flex;align-items:flex-start;gap:10px;border:1px solid var(--line);padding:12px 14px;border-radius:12px;background:#fff;transition:.15s}.choice:hover{border-color:#94a3b8;background:#fbfdff}.choice.selected{border-color:#5eead4;background:#f0fdfa}.choice input{margin-top:3px;accent-color:var(--brand)}.scale{display:grid;grid-template-columns:repeat(11,1fr);gap:6px;margin-top:13px}.scale button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 0;font-weight:700;color:#334155}.scale button.active{background:var(--brand);border-color:var(--brand);color:#fff}.scale-labels{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-top:6px}.text{width:100%;min-height:120px;border:1px solid var(--line);border-radius:12px;padding:12px 14px;outline:none;resize:vertical}.text:focus{border-color:#5eead4;box-shadow:0 0 0 3px rgba(20,184,166,.09)}.follow{margin-top:14px;padding:14px;background:#f8fafc;border:1px dashed #cbd5e1;border-radius:12px}.follow label{display:block;font-weight:700;font-size:13px;margin-bottom:7px}.follow textarea{min-height:90px}.other{margin-top:8px}.ranking{display:grid;gap:8px}.rank-row{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px 10px 10px 8px}.rank-num{width:28px;height:28px;border-radius:9px;background:#f0fdfa;color:var(--brand2);display:flex;align-items:center;justify-content:center;font-weight:800}.rank-actions{display:flex;gap:4px}.rank-actions button{width:30px;height:30px;border:1px solid var(--line);background:#fff;border-radius:8px}.status{font-size:12px;color:var(--muted);margin-top:10px;min-height:18px}.actions{display:flex;justify-content:flex-end;margin-top:24px}.submit{border:0;background:linear-gradient(135deg,var(--brand2),var(--brand));color:#fff;border-radius:12px;padding:13px 22px;font-weight:800;box-shadow:0 10px 25px rgba(13,148,136,.22)}.submit:disabled{opacity:.5;cursor:not-allowed}.errorbox{padding:22px;color:#7f1d1d;border-color:#fecaca;background:#fff7f7}.done{padding:44px 32px;text-align:center}.done .icon{width:58px;height:58px;border-radius:50%;background:#ecfdf5;color:var(--ok);display:flex;align-items:center;justify-content:center;font-size:28px;margin:0 auto 16px;font-weight:800}.done h2{font-size:26px;margin:0 0 8px}.hidden{display:none!important}.spinner{width:34px;height:34px;border:3px solid #cbd5e1;border-top-color:var(--brand);border-radius:50%;animation:spin .8s linear infinite;margin:70px auto}@keyframes spin{to{transform:rotate(360deg)}}
    @media(max-width:640px){.shell{padding:18px 12px 60px}.hero,.card{border-radius:16px}.hero{padding:22px}.hero h1{font-size:25px}.card{padding:18px}.prompt{font-size:17px}.scale{grid-template-columns:repeat(6,1fr)}.secure{display:none}.actions{justify-content:stretch}.submit{width:100%}}
  </style>
</head>
<body>
<div class="shell">
  <div class="top"><div class="brand"><span class="mark"></span><span>ENVOX <span style="font-weight:500;color:#64748b">Voz do Cliente</span></span></div><div class="secure">🔒 acesso individual e confidencial</div></div>
  <div id="loading" class="spinner"></div>
  <div id="error" class="errorbox hidden"></div>
  <div id="done" class="done hidden"><div class="icon">✓</div><h2>Resposta registrada</h2><p>Sua percepção foi salva com sucesso. Obrigado por contribuir com um diagnóstico mais preciso da parceria.</p></div>
  <main id="app" class="hidden">
    <section class="hero">
      <div class="eyebrow" id="clientName">Pesquisa de percepção</div>
      <h1 id="surveyTitle"></h1>
      <p id="introText"></p>
      <div class="who"><strong id="respondentName"></strong><div class="meta" id="respondentMeta"></div></div>
      <div class="conf" id="confidentiality"></div>
    </section>
    <div class="progress-wrap"><div class="progress-text"><span>Progresso</span><span id="progressText">0%</span></div><div class="progress-line"><span id="progressBar"></span></div></div>
    <div id="questions"></div>
    <div class="actions"><button id="submitBtn" class="submit">Concluir pesquisa</button></div>
    <div id="globalStatus" class="status" style="text-align:right"></div>
  </main>
</div>
<script>
(function(){
  const qs = new URLSearchParams(location.search); const token = qs.get('t');
  const S = {data:null, values:{}, comments:{}, timers:{}, saving:0};
  const $ = s => document.querySelector(s); const esc = v => String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  function fail(msg){ $('#loading').classList.add('hidden'); $('#app').classList.add('hidden'); $('#error').textContent=msg; $('#error').classList.remove('hidden'); }
  async function api(path, opts={}){ const r=await fetch(path,opts); let body=null; try{body=await r.json()}catch(e){} if(!r.ok){throw new Error(typeof body?.detail==='string'?body.detail:(body?.detail?.message||body?.message||('Erro '+r.status)))} return body; }
  function conditionMet(c){ if(!c||!Object.keys(c).length)return true; const a=S.values[c.question_key], e=c.value, op=c.operator||'eq'; if(op==='eq')return a===e;if(op==='neq')return a!==e;if(op==='lte')return Number(a)<=Number(e);if(op==='gte')return Number(a)>=Number(e);if(op==='in')return (e||[]).includes(a);if(op==='contains')return Array.isArray(a)&&a.includes(e);if(op==='truthy')return !!a;return true; }
  function followVisible(f,v){ if(!f||!Object.keys(f).length)return false; if(f.values)return f.values.includes(v); if(f.operator==='lte')return Number(v)<=Number(f.value); if(f.operator==='gte')return Number(v)>=Number(f.value); if(f.when_any)return Array.isArray(v)?v.length>0:!!v; return false; }
  function answered(q){ const v=S.values[q.key]; return !(v===undefined||v===null||v===''||(Array.isArray(v)&&!v.length)); }
  function visibleQuestions(){ return S.data.questions.filter(q=>conditionMet(q.condition)); }
  function progress(){ const v=visibleQuestions(), n=v.filter(answered).length, pct=v.length?Math.round(n/v.length*100):0; $('#progressBar').style.width=pct+'%'; $('#progressText').textContent=pct+'%'; }
  function setStatus(text){ $('#globalStatus').textContent=text||''; }
  function scheduleSave(q){ clearTimeout(S.timers[q.key]); S.timers[q.key]=setTimeout(()=>save(q),350); progress(); renderVisibilityAndFollowups(); }
  async function save(q){ if(!answered(q))return; S.saving++; setStatus('Salvando…'); try{ await api('/api/v1/voice/public/'+encodeURIComponent(token)+'/answers',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({answers:[{question_key:q.key,value:S.values[q.key],comment:S.comments[q.key]||null}]})}); setStatus('Resposta salva'); setTimeout(()=>{if(!S.saving)setStatus('')},900); }catch(e){setStatus('Não foi possível salvar agora. Tente novamente.');} finally{S.saving=Math.max(0,S.saving-1);} }
  function meta(r){ return [r.role_function,r.sector,r.unit,r.regional].filter(Boolean).map(x=>'<span>'+esc(x)+'</span>').join('<span>•</span>'); }
  function inputFor(q){ const val=S.values[q.key];
    if(q.type==='scale_0_10'){ return '<div class="scale">'+Array.from({length:11},(_,i)=>'<button type="button" data-scale="'+i+'" class="'+(Number(val)===i?'active':'')+'">'+i+'</button>').join('')+'</div><div class="scale-labels"><span>0 — muito ruim/baixo</span><span>10 — excelente/alto</span></div>'; }
    if(q.type==='single_choice'){ return '<div class="choices">'+q.options.map((o,i)=>'<label class="choice '+(val===o?'selected':'')+'"><input type="radio" name="'+esc(q.key)+'" value="'+esc(o)+'" '+(val===o?'checked':'')+'><span>'+esc(o)+'</span></label>').join('')+'</div>'; }
    if(q.type==='multi_choice'){ const arr=Array.isArray(val)?val:[]; return '<div class="choices">'+q.options.map(o=>'<label class="choice '+(arr.includes(o)?'selected':'')+'"><input type="checkbox" value="'+esc(o)+'" '+(arr.includes(o)?'checked':'')+'><span>'+esc(o)+'</span></label>').join('')+'</div>'+(arr.includes('Outro')?'<input class="text other" style="min-height:44px" data-other placeholder="Qual outro?" value="'+esc((S.comments[q.key]||'').replace(/^Outro:\s*/,'').split(' | Detalhe:')[0])+'">':''); }
    if(q.type==='open_text'||q.type==='text'){ return '<textarea class="text" data-open placeholder="Escreva aqui…">'+esc(val||'')+'</textarea>'; }
    if(q.type==='ranking'){ const order=Array.isArray(val)&&val.length?val:q.options.slice(); if(!Array.isArray(val)||!val.length)S.values[q.key]=order; return '<div class="ranking">'+order.map((o,i)=>'<div class="rank-row" data-rank="'+esc(o)+'"><div class="rank-num">'+(i+1)+'</div><div>'+esc(o)+'</div><div class="rank-actions"><button type="button" data-up title="Subir">↑</button><button type="button" data-down title="Descer">↓</button></div></div>').join('')+'</div>'; }
    return '<textarea class="text" data-open>'+esc(val||'')+'</textarea>';
  }
  function render(){ const root=$('#questions'); root.innerHTML=''; let last=''; S.data.questions.forEach(q=>{ if(!conditionMet(q.condition))return; if(q.section&&q.section!==last){const h=document.createElement('div');h.className='section-title';h.textContent=q.section;root.appendChild(h);last=q.section;} const card=document.createElement('section');card.className='card';card.dataset.key=q.key; const fshow=followVisible(q.followup,S.values[q.key]); card.innerHTML='<div class="qnum">Pergunta '+q.position+(q.required?' <span class="required">*</span>':'')+'</div><div class="prompt">'+esc(q.prompt)+'</div>'+(q.help_text?'<div class="help">'+esc(q.help_text)+'</div>':'')+inputFor(q)+(fshow?'<div class="follow"><label>'+esc(q.followup.prompt||'Conte um pouco mais sobre essa resposta:')+'</label><textarea class="text" data-follow placeholder="Detalhe aqui…">'+esc((S.comments[q.key]||'').replace(/^Outro:[^|]*\| Detalhe:\s*/,'').replace(/^Detalhe:\s*/,''))+'</textarea></div>':''); root.appendChild(card); bindCard(card,q); }); progress(); }
  function renderVisibilityAndFollowups(){ const before=[...document.querySelectorAll('.card')].map(x=>x.dataset.key).join('|'); const after=visibleQuestions().map(x=>x.key).join('|'); let followChange=false; for(const q of visibleQuestions()){const c=document.querySelector('.card[data-key="'+CSS.escape(q.key)+'"]'); if(!c)continue; const has=!!c.querySelector('[data-follow]'), want=followVisible(q.followup,S.values[q.key]); if(has!==want){followChange=true;break;}} if(before!==after||followChange)render(); }
  function bindCard(card,q){
    card.querySelectorAll('[data-scale]').forEach(b=>b.onclick=()=>{S.values[q.key]=Number(b.dataset.scale);scheduleSave(q);render();});
    card.querySelectorAll('input[type=radio]').forEach(i=>i.onchange=()=>{S.values[q.key]=i.value;scheduleSave(q);render();});
    card.querySelectorAll('input[type=checkbox]').forEach(i=>i.onchange=()=>{const arr=new Set(Array.isArray(S.values[q.key])?S.values[q.key]:[]);i.checked?arr.add(i.value):arr.delete(i.value);S.values[q.key]=[...arr];scheduleSave(q);render();});
    const open=card.querySelector('[data-open]'); if(open)open.oninput=()=>{S.values[q.key]=open.value;scheduleSave(q)};
    const other=card.querySelector('[data-other]'); if(other)other.oninput=()=>{const old=S.comments[q.key]||'';const detail=old.includes('Detalhe:')?old.split('Detalhe:').slice(1).join('Detalhe:').trim():'';S.comments[q.key]='Outro: '+other.value+(detail?' | Detalhe: '+detail:'');scheduleSave(q)};
    const follow=card.querySelector('[data-follow]'); if(follow)follow.oninput=()=>{const old=S.comments[q.key]||'';const outro=old.startsWith('Outro:')?old.split('| Detalhe:')[0].trim():'';S.comments[q.key]=(outro?outro+' | ':'')+'Detalhe: '+follow.value;scheduleSave(q)};
    card.querySelectorAll('[data-up],[data-down]').forEach(btn=>btn.onclick=()=>{const row=btn.closest('[data-rank]'), name=row.dataset.rank, arr=S.values[q.key].slice(), idx=arr.indexOf(name), n=btn.hasAttribute('data-up')?idx-1:idx+1;if(n<0||n>=arr.length)return;[arr[idx],arr[n]]=[arr[n],arr[idx]];S.values[q.key]=arr;scheduleSave(q);render();});
  }
  async function complete(){ const visible=visibleQuestions(); const missing=visible.filter(q=>q.required&&!answered(q)); if(missing.length){const first=document.querySelector('.card[data-key="'+CSS.escape(missing[0].key)+'"]');first?.scrollIntoView({behavior:'smooth',block:'center'}); first && (first.style.borderColor='#fca5a5'); setStatus('Há perguntas obrigatórias sem resposta.');return;} const btn=$('#submitBtn');btn.disabled=true;btn.textContent='Concluindo…'; try{ for(const q of visible){clearTimeout(S.timers[q.key]);if(answered(q))await save(q);} await api('/api/v1/voice/public/'+encodeURIComponent(token)+'/complete',{method:'POST'}); $('#app').classList.add('hidden');$('#done').classList.remove('hidden');window.scrollTo({top:0,behavior:'smooth'});}catch(e){setStatus(e.message||'Não foi possível concluir.');btn.disabled=false;btn.textContent='Concluir pesquisa';} }
  async function init(){ if(!token)return fail('Este link de pesquisa está incompleto ou inválido.'); try{const d=await api('/api/v1/voice/public/'+encodeURIComponent(token));S.data=d;Object.entries(d.answers||{}).forEach(([k,a])=>{S.values[k]=a.value;S.comments[k]=a.comment||''});$('#clientName').textContent=d.client.name;$('#surveyTitle').textContent=d.survey.title;$('#introText').textContent=d.survey.intro_text||'';$('#confidentiality').textContent=d.survey.confidentiality_text||'';$('#respondentName').textContent='Olá, '+d.respondent.name;$('#respondentMeta').innerHTML=meta(d.respondent);$('#loading').classList.add('hidden'); if(d.respondent.status==='completed'){ $('#done').classList.remove('hidden');return;} $('#app').classList.remove('hidden');render();$('#submitBtn').onclick=complete;}catch(e){fail(e.message||'Não foi possível abrir esta pesquisa.');} }
  init();
})();
</script>
</body>
</html>
