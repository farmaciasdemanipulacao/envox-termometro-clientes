server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Logs
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    # Dashboard — serve o SPA
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Service Worker: nunca cachear — navegador precisa checar atualização a cada load
    # (iOS Safari já é lento pra detectar SW novo; cache immutable travaria de vez)
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Assets estáticos com cache longo
    location ~* \.(js|css|png|jpg|ico|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Proxy reverso para o servidor WPP (evita Mixed Content HTTP→HTTPS)
    location /wpp-proxy/ {
        proxy_pass http://187.127.6.191:21465/;
        proxy_http_version 1.1;
        proxy_set_header Host 187.127.6.191;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
}
